[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finetune-lora"
version = "3.0.0"
description = "Generic local LoRA/QLoRA training and retrieval framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]
docs = [
  "docling>=2.121,<3",
  "pypdf>=5",
]
train = [
  "accelerate>=1.2",
  "peft>=0.14",
  "torch>=2.5",
  "transformers>=4.48",
]
mlx = [
  "mlx>=0.22",
  "mlx-lm>=0.21",
  "transformers>=4.48",
]
qlora = [
  "bitsandbytes>=0.45",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
